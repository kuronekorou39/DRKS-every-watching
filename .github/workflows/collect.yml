name: collect

# GitHub Actions の cron は混雑で数時間あくことがあり、書いた間隔では動かない。
# そこで1回の実行の中で一定間隔の取得を繰り返し、終わる直前に自分で次の実行を起動してつないでいく。
# cron は、そのつながりが切れていたときに起こし直すための保険として残す。
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

# data ブランチへの push が競合しないよう、同時に1本だけ走らせる。
# 走っている間に来た起動は1つだけ待機し、いまの実行が終わったら引き継ぐ
concurrency:
  group: collect
  cancel-in-progress: false

env:
  INTERVAL_SECONDS: 600 # 取得の間隔
  LOOP_MINUTES: 330 # 1回の実行で繰り返す時間（1ジョブの上限は6時間）
  ALERT_AFTER: 3 # 不調がこの回数つづいたら Issue で知らせる（一時的な失敗では知らせない）
  ALERT_LABEL: collect-alert

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write # data ブランチへの push
      actions: write # deploy と、次の collect の起動
      issues: write # 不調の知らせ
    env:
      GH_TOKEN: ${{ github.token }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
      KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
      DATA_DIR: data
      PROBLEMS_FILE: ${{ runner.temp }}/problems.md
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: data ブランチを data/ に取り出す
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data:refs/remotes/origin/data
            git worktree add -B data data origin/data
          else
            git worktree add --orphan -b data data
          fi

      # 取得の不調（チャンネルが見つからない、ある配信先の API が通らない、など）は、実行を失敗にはせず Issue で知らせる。
      # 失敗にすると取得の繰り返しごと止まってしまい、問題のないチャンネルの記録まで途切れるため。
      # 知らせは不調1件につき Issue 1つだけ（つづいている間は増やさない）。直ったら自動で閉じる
      - name: 一定間隔で取得を繰り返す
        run: |
          # 知らせの操作（gh）が一時的に失敗しても、取得の繰り返しは止めない
          gh label create "$ALERT_LABEL" --color D93F0B --description "取得の不調（自動で作成・クローズ）" --force >/dev/null || true
          alert=$(gh issue list --label "$ALERT_LABEL" --state open --limit 1 --json number -q '.[0].number // empty' || true)
          posted=""
          streak=0
          end=$((SECONDS + LOOP_MINUTES * 60))
          while [ "$SECONDS" -lt "$end" ]; do
            started=$SECONDS

            # 実行中に main が変わっても（channels.json や取得スクリプトの変更）、次の回から反映されるようにする
            git fetch --quiet --depth=1 origin main && git checkout --quiet --detach FETCH_HEAD

            : > "$PROBLEMS_FILE"
            if node scripts/fetch.mjs; then
              git -C data add history.json
              if ! git -C data diff --cached --quiet; then
                git -C data -c user.name='github-actions[bot]' \
                    -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                    commit --quiet -m "記録を更新"
                git -C data push --quiet origin data
                # 記録が変わったときだけ公開し直す
                gh workflow run deploy.yml --ref main || echo "::warning::deploy を起動できませんでした"
              fi
            else
              echo "- 取得スクリプトが失敗し、今回は何も記録できませんでした（設定ファイルの書き間違いか、すべての API の不調）" >> "$PROBLEMS_FILE"
            fi

            if [ -s "$PROBLEMS_FILE" ]; then
              streak=$((streak + 1))
              problems=$(cat "$PROBLEMS_FILE")
              # 前の実行から開いたままの Issue があれば、同じ内容をもう一度は書き込まない
              if [ -n "$alert" ] && [ -z "$posted" ]; then posted=$problems; fi
              if [ "$streak" -ge "$ALERT_AFTER" ] && [ "$problems" != "$posted" ]; then
                body=$(printf '取得で、次の不調が %s 回つづいています。\n\n%s\n\n取れている分の記録は続けています。直ると、この Issue は自動で閉じます。\n\n実行のログ: %s\n' "$streak" "$problems" "$RUN_URL")
                if [ -z "$alert" ]; then
                  url=$(gh issue create --title "取得がうまくいっていません" --label "$ALERT_LABEL" --body "$body" || true)
                  alert=${url##*/}
                else
                  # 知らせたあとで内容が変わったときだけ、追記する
                  gh issue comment "$alert" --body "$body" >/dev/null || true
                fi
                posted=$problems
              fi
            else
              streak=0
              posted=""
              if [ -n "$alert" ]; then
                gh issue close "$alert" --comment "不調が解消しました。すべて取得できています。" >/dev/null || true
                alert=""
              fi
            fi

            wait=$((INTERVAL_SECONDS - (SECONDS - started)))
            if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          done

      - name: 次の実行を起動してつなぐ
        run: |
          # cron などで起動した実行がすでに待機していれば、それが引き継ぐので何もしない
          waiting=$(gh run list --workflow collect.yml --limit 20 --json status -q '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')
          if [ "$waiting" -eq 0 ]; then gh workflow run collect.yml --ref main; fi
