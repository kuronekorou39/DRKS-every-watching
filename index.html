<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>配信の記録</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main>
    <header class="hero">
      <h1>配信の記録</h1>
      <p id="status" class="status" aria-live="polite">読み込み中…</p>
    </header>

    <section aria-labelledby="board-title">
      <h2 id="board-title" class="sr-only">配信のスケジュール</h2>
      <div class="controls">
        <div class="step" role="group" aria-label="表示範囲">
          <button type="button" id="prev" aria-label="前へ">◀</button>
          <!-- 日付の文字の上に透明な日付入力を重ねてあり、押すとカレンダーが開く -->
          <label class="pick"><span id="from-text"></span><input type="date" id="from" aria-label="開始日"></label>
          <span id="to-part">〜<label class="pick"><span id="to-text"></span><input type="date" id="to" aria-label="終了日"></label></span>
          <button type="button" id="next" aria-label="次へ">▶</button>
        </div>
        <button type="button" id="today" class="pill">今日</button>
        <div class="range" role="group" aria-label="表示する日数">
          <button type="button" data-days="1">1日</button>
          <button type="button" data-days="3">3日</button>
          <button type="button" data-days="7">1週</button>
          <button type="button" data-days="14">2週</button>
          <button type="button" data-days="28">4週</button>
        </div>
        <!-- 狭い画面では上のボタン列の代わりにこちらを出す -->
        <select id="days" class="pill" aria-label="表示する日数">
          <option value="1">1日</option>
          <option value="3">3日</option>
          <option value="7">1週</option>
          <option value="14">2週</option>
          <option value="28">4週</option>
          <option value="" hidden>指定</option>
        </select>
      </div>
      <div class="scroll">
        <div id="board" class="board"></div>
      </div>
      <p class="legend">
        <span><i class="plat p-twitch">T</i>Twitch</span>
        <span><i class="plat p-youtube">Y</i>YouTube</span>
        <span><i class="plat p-kick">K</i>Kick</span>
        <span>縞が流れているバーは配信中</span>
      </p>
      <p id="detail" class="detail" aria-live="polite"></p>
    </section>

    <footer class="foot">
      <p>時刻はすべて日本時間です。開始時刻は正確ですが、アーカイブの残っていない配信は終了時刻が最大10分ほどずれることがあります。</p>
    </footer>
  </main>
</body>
</html>
