<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>配信の記録</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main>
    <header class="hero">
      <h1>配信の記録</h1>
      <p id="status" class="status" aria-live="polite">読み込み中…</p>
      <nav id="nav" class="nav" aria-label="チャンネル"></nav>
    </header>

    <div class="controls">
      <div class="range" role="group" aria-label="時間帯の集計期間">
        <button type="button" data-weeks="4">4週</button>
        <button type="button" data-weeks="8" aria-pressed="true">8週</button>
        <button type="button" data-weeks="12">12週</button>
        <button type="button" data-weeks="all">全期間</button>
      </div>
      <p class="legend">
        <span>少ない</span><span class="legend-ramp" aria-hidden="true"></span><span>多い</span>
      </p>
    </div>

    <div id="channels"></div>

    <footer class="foot">
      <p>時刻はすべて日本時間です。開始時刻は正確ですが、アーカイブの残っていない配信は終了時刻が最大10分ほどずれることがあります。</p>
    </footer>
  </main>
</body>
</html>
