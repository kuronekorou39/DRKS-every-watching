<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>配信の記録</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main>
    <header class="hero">
      <h1>配信の記録</h1>
      <p id="status" class="status" aria-live="polite">読み込み中…</p>
    </header>

    <section aria-labelledby="board-title">
      <div class="controls">
        <h2 id="board-title" class="range-label">&nbsp;</h2>
        <div class="step" role="group" aria-label="表示範囲を前後に動かす">
          <button type="button" id="prev" aria-label="前へ">◀</button>
          <button type="button" id="today">今日</button>
          <button type="button" id="next" aria-label="次へ">▶</button>
        </div>
        <div class="range" role="group" aria-label="表示する日数">
          <button type="button" data-days="1">1日</button>
          <button type="button" data-days="3">3日</button>
          <button type="button" data-days="7">1週</button>
          <button type="button" data-days="14">2週</button>
          <button type="button" data-days="28">4週</button>
        </div>
        <div class="dates">
          <label>開始 <input type="date" id="from"></label>
          <label>終了 <input type="date" id="to"></label>
        </div>
      </div>
      <div class="scroll">
        <div id="board" class="board"></div>
      </div>
      <p id="detail" class="detail" aria-live="polite"></p>
    </section>

    <footer class="foot">
      <p>時刻はすべて日本時間です。開始時刻は正確ですが、アーカイブの残っていない配信は終了時刻が最大10分ほどずれることがあります。</p>
    </footer>
  </main>
</body>
</html>
