<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>泥臭ログ</title>
  <meta name="description" content="DRKS の配信実績を1枚のスケジュールボードで見る、非公式のファンサイト">
  <!-- 指定しないと、同じドメインの別サイトのアイコンがタブや共有画面に使われてしまう -->
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:title" content="泥臭ログ">
  <meta property="og:description" content="DRKS の配信実績を1枚のスケジュールボードで見る、非公式のファンサイト">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kuronekorou39.github.io/DRKS-every-watching/">
  <meta property="og:image" content="https://kuronekorou39.github.io/DRKS-every-watching/icons/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <!-- X などで、画面のキャプチャを大きなカードで出す -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://kuronekorou39.github.io/DRKS-every-watching/icons/og.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- ライトかダークかは、描く前にここで決める（あとから決めると、最初の一瞬だけ違う色で出てしまう）。
       フッターのボタンで選んだものがあればそれ、なければ OS の設定に合わせる -->
  <script>
    let chosen = null;
    try { chosen = localStorage.getItem('theme'); } catch { /* 保存できない環境では OS の設定に合わせる */ }
    document.documentElement.dataset.theme = chosen ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <!-- マルチビューのアイコン（2×2 のタイル）。ヘッダーとフッターの両方から参照する -->
  <svg class="sr-only" aria-hidden="true">
    <symbol id="icon-multiview" viewBox="0 0 16 16">
      <path fill="currentColor" d="M2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.500v-3A1.5 1.5 0 0 1 2.5 1zm8 0h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.500v-3A1.5 1.5 0 0 1 10.5 1zm-8 8h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5v-3A1.5 1.5 0 0 1 2.5 9zm8 0h3a1.500 1.500 0 0 1 1.500 1.500v3a1.500 1.500 0 0 1-1.500 1.500h-3A1.5 1.5 0 0 1 9 13.5v-3A1.5 1.5 0 0 1 10.5 9z"/>
    </symbol>
  </svg>
  <main>
    <header class="hero">
      <h1>泥臭ログ</h1>
      <div class="controls" role="group" aria-label="表示範囲の操作">
        <div class="step" role="group" aria-label="表示範囲">
          <button type="button" id="prev" aria-label="前へ" title="前へ（← キー）">◀</button>
          <!-- 日付の文字の上に透明な日付入力を重ねてあり、押すとカレンダーが開く -->
          <label class="pick"><span id="from-text"></span><input type="date" id="from" aria-label="開始日"></label>
          <span id="to-part">〜<label class="pick"><span id="to-text"></span><input type="date" id="to" aria-label="終了日"></label></span>
          <button type="button" id="next" aria-label="次へ" title="次へ（→ キー）">▶</button>
          <!-- 「今日」も表示位置を動かす操作なので、◀ ▶ と同じまとまりに入れる -->
          <span class="sep" aria-hidden="true"></span>
          <button type="button" class="js-today" title="今日へ（T キー）">今日</button>
        </div>
        <div class="range" role="group" aria-label="表示する日数">
          <!-- 選択中のボタンの下に敷く塗りつぶし。JS が位置と幅を決め、切り替えると横に滑る -->
          <span class="thumb" aria-hidden="true"></span>
          <button type="button" data-days="1">1日</button>
          <button type="button" data-days="3">3日</button>
          <button type="button" data-days="7">1週</button>
          <button type="button" data-days="14">2週</button>
          <button type="button" data-days="28">4週</button>
        </div>
        <!-- ボタン列が入りきらない幅では、代わりにこのプルダウンを出す -->
        <select class="pill js-days" aria-label="表示する日数">
          <option value="1">1日</option>
          <option value="3">3日</option>
          <option value="7">1週</option>
          <option value="14">2週</option>
          <option value="28">4週</option>
          <option value="" hidden>指定</option>
        </select>
        <!-- 窮屈な幅ではアイコンだけにし、それでも入らない幅ではフッターのリンクに任せる -->
        <a class="pill multiview" href="https://kuronekorou39.github.io/chrome-parallel-stream/multiview.html" target="_blank" rel="noopener" aria-label="マルチビュー（1つのタブで複数の配信を並べて見る）" title="1つのタブで複数の配信を並べて見る">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><use href="#icon-multiview"/></svg>
          <span class="label">マルチビュー</span>
        </a>
      </div>
    </header>
    <p id="status" class="status" aria-live="polite">読み込み中…</p>

    <section aria-labelledby="board-title">
      <h2 id="board-title" class="sr-only">配信のスケジュール</h2>
      <div class="scroll">
        <div id="board" class="board"></div>
      </div>
      <div id="detail" class="detail" role="dialog" aria-label="配信の詳細" hidden></div>
    </section>

    <footer class="foot">
      <p class="legend">
        <span><i class="plat p-twitch" title="Twitch">T</i><span class="label">Twitch</span></span>
        <span><i class="plat p-youtube" title="YouTube">Y</i><span class="label">YouTube</span></span>
        <span><i class="plat p-kick" title="Kick">K</i><span class="label">Kick</span></span>
      </p>
      <p class="links">
        <!-- ヘッダーにマルチビューのリンクを出せない幅のときだけ出す -->
        <a class="multiview" href="https://kuronekorou39.github.io/chrome-parallel-stream/multiview.html" target="_blank" rel="noopener" aria-label="マルチビュー（1つのタブで複数の配信を並べて見る）" title="マルチビュー（1つのタブで複数の配信を並べて見る）">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><use href="#icon-multiview"/></svg>
        </a>
        <a href="https://dorokusa.co.jp/" target="_blank" rel="noopener">公式<span class="wide-only">サイト</span> ↗</a>
        <a class="github" href="https://github.com/kuronekorou39/DRKS-every-watching" target="_blank" rel="noopener" aria-label="GitHub でソースを見る" title="GitHub">
          <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <!-- ライトのときは月（押すとダークへ）、ダークのときは太陽（押すとライトへ）を出す -->
        <button type="button" class="theme" aria-label="ライト／ダークを切り替える" title="ライト／ダークを切り替える">
          <svg class="to-dark" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M6.2.6a7.5 7.5 0 1 0 9.2 9.2A6.2 6.2 0 0 1 6.2.6z"/></svg>
          <svg class="to-light" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.05 3.05l1.06 1.06M11.89 11.89l1.06 1.06M3.05 12.95l1.06-1.06M11.89 4.11l1.06-1.06"/></svg>
        </button>
      </p>
      <p class="note">非公式ファンサイト ・ 時刻は日本時間<span class="note-extra"> ・ 終了は最大10分ずれます</span></p>
    </footer>
  </main>
</body>
</html>
